<source srcset="logo-black.svg" media="(prefers-color-scheme: light)">
<img src="logo-white.svg" alt="SquadPad" width="152" height="38">

<main id="main" class="card">
<p class="eyebrow">Match availability</p>
<h1>Can your player play?</h1>
<noscript><p class="note">This page needs JavaScript to send your reply. You can also reply in the SquadPad app.</p></noscript>
<form id="reply" hidden>
<fieldset>
<legend class="visually-hidden">Can your player play in the next match?</legend>
<label class="choice choice-yes"><input type="radio" name="answer" value="yes"><span class="mark" aria-hidden="true"></span><span class="choice-text"><strong>Available</strong><span>Count them in</span></span></label>
<label class="choice choice-no"><input type="radio" name="answer" value="no"><span class="mark" aria-hidden="true"></span><span class="choice-text"><strong>Not available</strong><span>Not this time</span></span></label>
</fieldset>
<button id="confirm" type="submit">Confirm</button>
</form>
<p id="status" role="status" aria-live="polite">Reading your reply link…</p>
<p class="app"><a id="open-app" hidden>Open in the SquadPad app</a></p>
<p class="meta">No sign-in needed. Nothing is sent until you tap Confirm.</p>
</main>
<footer>Anyone with this link can reply for this player, so please don't forward the email.</footer>
